<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison du Pain — À Propos</title>
    <link rel="icon" type="image/png" href="/images/logo_maison_du_pain.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- Barre de Naviguation de l'Accueil  -->
        <nav class="container-fluid d-flex justify-content-between align-items-center pt-3 bg-warning-subtle">
            <!-- partie du logo + nom  -->
            <a href="index.html" class="text-decoration-none text-dark">
                <div class="d-flex gap-3">
                    <img src="images/logo_maison_du_pain.png" class="h-50" style="width: 3rem;" alt="logo">
                    <div style="line-height: 1px;">
                        <h3 id="Nom">Maison Du Pain</h3>
                        <p class="fw-semibold" style="font-size: 12px;">Boulangerie Au Goût Authentique</p>
                    </div>
                </div>
            </a>
            <!-- liens de naviguation  -->
            <div class="d-none d-lg-block">
                <ul class="list-unstyled d-flex gap-5 mb-0">
                    <li class="nav-item"><a href="index.html" class="nav-link text-uppercase fw-semibold">Accueil</a></li>
                    <li class="nav-item"><a href="produits.html" class="nav-link text-uppercase fw-semibold">Produits</a></li>
                    <li class="nav-item"><a href="about.html" class="nav-link active border-bottom border-1 border-dark text-uppercase fw-semibold">À Propos</a></li>
                    <li class="nav-item"><a href="contact.html" class="nav-link text-uppercase fw-semibold">Contact</a></li>
                </ul>
            </div>
            <!-- Menu Hamburger et iconPanier  -->
            <div class="d-flex align-items-center gap-3">
                <div class="d-flex align-content-center gap-4">
                    <a href="commande.html" class="nav-link"><i class="bi bi-cart3 fs-3"></i></a>
                    <a href="commande.html" class= "btn text-white fw-semibold d-none d-lg-block" style="background-color:maroon;">Commander</a>
                </div>
                <button class="btn d-lg-none fs-3" type="button" data-bs-toggle="collapse" data-bs-target="#menuMobile"
                    onclick="this.querySelector('i').classList.toggle('bi-x-lg'); this.querySelector('i').classList.toggle('bi-list');">
                    <i class="bi bi-list"></i>
                </button>
            </div>
        </nav>
        <!-- Liens de Naviguation au Mobile  -->
        <div class="collapse d-lg-none w-100" id="menuMobile">
            <div class="py-3 px-4">
                <ul class="list-unstyled mb-3">
                    <li class="mb-2"><a href="index.html" class="nav-link fs-5 text-uppercase">Accueil</a></li>
                    <li class="mb-2"><a href="produits.html" class="nav-link fs-5 text-uppercase">Produits</a></li>
                    <li class="mb-2"><a href="about.html" class="nav-link active border-bottom border-1 border-dark w-25 fs-5 text-uppercase">À Propos</a></li>
                    <li><a href="contact.html" class="nav-link fs-5 text-uppercase">Contact</a></li>
                </ul>
                <!-- Commander dans le menu mobile -->
                <a href="commande.html" class="btn text-white fw-semibold mb-0 w-100 fs-5 text-uppercase" style="background-color:maroon;">Commander</a>
            </div>
        </div>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
