<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison du Pain — Contact</title>
</head>
<body>

        <header>
            <nav>
                <b>La Maison du Pain</b> &nbsp;
                <a href="index.html">Accueil</a> &nbsp;
                <a href="a-propos.html">À propos</a> &nbsp;
                <a href="contact.html">Contact</a>
            </nav>
        </header>

        <main>
            <h1>Contactez-nous</h1>
            <p>Une question, une demande ou une suggestion ? Remplissez le formulaire.</p>

            <form action="" method="">
                    <label for="nom">Nom complet :</label>
                    <input type="text" id="nom" name="nom" required> <br>

                    <br><label for="email">Adresse e-mail :</label>
                    <input type="email" id="email" name="email" required> <br>

                    <br><label for="telephone">Téléphone :</label>
                    <input type="tel" id="telephone" name="telephone"><br>

                    <br><label for="date">Date et heure souhaitée :</label>
                    <input type="datetime-local" id="date" name="date"> <br>

                    <br><label for="motif">Motif de contact</label>
                    <select id="motif" name="motif" required>
                        <option value="">-- Choisir --</option>
                        <option value="question">Question générale</option>
                        <option value="commande">Demande de commande</option>
                        <option value="evenement">Commande pour un événement</option>
                        <option value="suggestion">Suggestion</option>
                    </select> <br>

                    <br> <label for="message">Message</label>
                    <textarea id="message" name="message" rows="10" cols="45" required></textarea> <br>

                <br><button type="submit">Envoyer le message</button>
            </form>
        </main>

        <footer><p>&copy; 2026 Maison du Pain</p></footer>
</body>
</html>
