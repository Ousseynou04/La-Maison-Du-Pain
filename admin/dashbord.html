<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tableau de bord de l'administrateur">
    <title>Maison du Pain — Dashbord</title>
    <link rel="icon" type="image/png" href="/images/logo_maison_du_pain.png">
    <link rel="stylesheet" href="styleAdmin.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> 
</head>
<body>

    <header class="border-bottom">
        <!-- Barre de Naviguation : espace admin -->
        <nav class="barnav page-container px-lg-5 pt-3 pb-1 px-4 d-flex justify-content-between align-items-center">
            <!-- partie du logo + nom  -->
                <div class="d-flex gap-3">
                    <img src="/images/logo_maison_du_pain.png" style="width: 2.5rem; height: 2.5rem;" alt="logo">
                    <div class="NameBrand" style="line-height: 1px;">
                        <h5 id="Nom">Maison Du Pain</h5>
                        <p class="Nom-txt fw-semibold" style="font-size: 12px;">Espace Administration</p>
                    </div>
                </div>
            <!-- liens de naviguation -->
            <div class="d-none d-lg-block border px-2 py-1 rounded-3">
                <ul class="list-unstyled d-flex align-items-center gap-5 mb-0">
                    <li class="nav-item"><a href="dashbord.html" class="nav-link active fw-semibold text-white py-1 px-2 rounded-3" style="background-color: maroon;" aria-current="page"><i class="bi bi-grid-1x2"></i> Tableau de Bord</a></li>
                    <li class="nav-item"><a href="catalogue.html" class="nav-link fw-semibold"><i class="bi bi-box-seam"></i> Catalogue</a></li>
                    <li class="nav-item"><a href="commandes.html" class="nav-link fw-semibold"><i class="bi bi-receipt"></i> Commandes</a></li>
                </ul>
            </div>
            <!-- btn boutique / deconnexion et menu hamburger -->
            <div class="d-flex align-items-center gap-lg-3 gap-2">
                <div class="d-none d-lg-flex align-items-center gap-4">
                    <a href="../index.html" class="nav-link btn-boutique px-3 py-1 fw-semibold rounded-4 border"><i class="bi bi-shop"></i> Boutique</a>
                    <a href="#" class="nav-link btn-deconnexion px-3 py-1 fw-semibold rounded-4 border text-danger"><i class="bi bi-box-arrow-right"></i> Deconnexion</a>
                </div>
                <button class="btn d-lg-none fs-3" type="button" data-bs-toggle="collapse" data-bs-target="#menuMobile" aria-controls="menuMobile"
                    aria-expanded="false" aria-label="Ouvrir le menu de navigation" onclick="this.querySelector('i').classList.toggle('bi-x-lg'); 
                    this.querySelector('i').classList.toggle('bi-list');">
                    <i class="bi bi-list"></i>
                </button>
            </div>
        </nav>
        <!-- Liens de Naviguation au Mobile -->
        <div class="nav-collapse collapse d-lg-none w-100" id="menuMobile">
            <nav class="page-container py-3 px-4">
                <ul class="list-unstyled mb-4">
                    <li class="nav-item mb-4 d-inline-block"><a href="dashbord.html" class="nav-link fs-5 active fw-semibold py-1 px-2 rounded-3 text-white" aria-current="page" style="background-color: maroon;"><i class="bi bi-grid-1x2"></i> Tableau de Bord</a></li>
                    <li class="nav-item mb-4"><a href="catalogue.html" class="nav-link fs-5 px-1 fw-semibold"><i class="bi bi-box-seam"></i> Catalogue</a></li>
                    <li class="nav-item"><a href="commandes.html" class="nav-link fs-5 px-1 fw-semibold"><i class="bi bi-receipt"></i> Commandes</a></li>
                </ul>
                <!--btn bouton et deconnexion dans le menu mobile -->
                <div class="d-flex gap-3">
                    <a href="../index.html" class="nav-link fs-5 w-100 px-3 py-1 fw-semibold text-center rounded-4 border"><i class="bi bi-shop"></i> Boutique</a>
                    <a href="#" class="nav-link fs-5 w-100 px-3 py-1 fw-semibold text-center rounded-4 border text-danger"><i class="bi bi-box-arrow-right"></i> Deconnexion</a>

            </nav>

</html>
